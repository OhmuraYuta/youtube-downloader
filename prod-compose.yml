services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile.prod
    container_name: youtube_downloader
    volumes:
      - ./app:/var/www/html/youtube_downloader
      - ~/reverse-proxy/var/www/html/youtube_downloader/public:/var/www/html/youtube_downloader/public
    ports:
      - "9000:9000"
    tty: true
    networks:
      - proxy_network
      - default
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.3
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    expose:
      - 3306
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  proxy_network:
    external: true
